name: Gerar ícones do Silhueta
on:
  push:
    branches: [main]
    paths:
      - 'icons/icon.svg'
      - '.github/workflows/icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Converter SVG em ícones PNG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          base=Path('icons')
          svg=(base/'icon.svg').read_bytes()
          def render(size,filename):
              out=cairosvg.svg2png(bytestring=svg,output_width=size,output_height=size)
              (base/filename).write_bytes(out)
          render(192,'icon-192.png')
          render(512,'icon-512.png')
          render(180,'apple-touch-icon.png')
          # A máscara mantém margem de segurança em torno da silhueta
          foreground=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg,output_width=416,output_height=416))).convert('RGBA')
          canvas=Image.new('RGBA',(512,512),'#62258c')
          canvas.alpha_composite(foreground,(48,48))
          canvas.convert('RGB').save(base/'icon-maskable-512.png',optimize=True)
          PY
      - name: Publicar imagens no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Build Android PWA icons from icon.svg"
            git push
          fi
