name: Mobile and input regression checks
on:
  push:
    branches: [main, fix/mobile-inputs-2-9-1]
    paths:
      - index.html
      - navigation.js
      - service-worker.js
      - qa/mobile-input-audit.mjs
      - .github/workflows/mobile-input-audit.yml
  pull_request:
    paths:
      - index.html
      - navigation.js
      - service-worker.js
      - qa/mobile-input-audit.mjs
      - .github/workflows/mobile-input-audit.yml
permissions:
  contents: read
jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser tooling
        run: |
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
      - name: Run isolated mobile and data regression checks
        env:
          PWA_CHROME_CHANNEL: chrome
        run: node qa/mobile-input-audit.mjs
      - name: Preserve report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silhueta-mobile-input-audit
          path: qa/mobile-audit-output/
          retention-days: 14
