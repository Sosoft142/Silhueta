name: Navigation and visual cleanup checks
on:
  pull_request:
    paths:
      - index.html
      - navigation.js
      - qa/navigation-visual-audit.mjs
      - .github/workflows/navigation-visual-audit.yml
  push:
    branches: [main]
    paths:
      - index.html
      - navigation.js
      - qa/navigation-visual-audit.mjs
      - .github/workflows/navigation-visual-audit.yml
permissions:
  contents: read
jobs:
  navigation-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling
        run: npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1
      - name: Verify navigation syntax
        run: node --check navigation.js
      - name: Verify history, discard guards and responsive CSS
        env:
          PWA_CHROME_CHANNEL: chrome
        run: node qa/navigation-visual-audit.mjs
      - name: Preserve reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silhueta-navigation-visual-audit
          path: qa/navigation-audit-output/
          retention-days: 14
